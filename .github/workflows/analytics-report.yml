name: Update aggregate traffic report

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-aggregate-analytics-report
  cancel-in-progress: false

jobs:
  report:
    # Keep disabled until the aggregate-only Worker has been deployed and verified.
    if: ${{ vars.ANALYTICS_PUBLIC_REPORT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test privacy validation without network access
        run: node --test analytics/cloudflare/test/export-report.test.mjs
      - name: Fetch and validate public aggregates
        run: node analytics/cloudflare/export-report.mjs
      - name: Commit only generated report files
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- reports/traffic/summary.json reports/traffic/README.md
          if git diff --cached --quiet -- reports/traffic/summary.json reports/traffic/README.md; then
            echo "No aggregate report changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --only -m 'Update public aggregate traffic report' -- reports/traffic/summary.json reports/traffic/README.md
          git push origin "HEAD:${DEFAULT_BRANCH}"
